plugins { id 'com.android.application' }

android {
    namespace 'io.github.shandianchengzi.txtreader'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.shandianchengzi.txtreader'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '0.1.3'
    }

    signingConfigs {
        permanent {
            def keyPath = System.getenv('ANDROID_SIGNING_STORE_FILE')
            storeFile file(keyPath ?: 'signing-key-not-configured.p12')
            storePassword System.getenv('ANDROID_SIGNING_PASSWORD') ?: ''
            keyAlias 'txtreader'
            keyPassword System.getenv('ANDROID_SIGNING_PASSWORD') ?: ''
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            if (System.getenv('ANDROID_SIGNING_STORE_FILE') && System.getenv('ANDROID_SIGNING_PASSWORD')) {
                signingConfig signingConfigs.permanent
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

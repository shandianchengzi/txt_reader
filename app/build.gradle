plugins { id 'com.android.application' }

android {
    namespace 'io.github.shandianchengzi.txtreader'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.shandianchengzi.txtreader'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

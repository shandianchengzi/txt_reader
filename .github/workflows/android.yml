name: Android APK Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build small installable APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk txt-reader-v0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: txt-reader-apk
          path: txt-reader-v0.1.0.apk
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 txt-reader-v0.1.0.apk --title "TXT Reader v0.1.0" --notes "轻量 Android TXT 阅读器：离线阅读、中文自动分章、使用系统中文离线 TTS 朗读。此版为 debug 签名安装包；重新构建可能需要先卸载旧版。" || {
            gh release upload v0.1.0 txt-reader-v0.1.0.apk --clobber
          }

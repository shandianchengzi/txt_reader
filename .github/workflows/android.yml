name: Android APK Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK (no private signing key required)
        run: gradle --no-daemon :app:assembleDebug
      - name: Signing key required for Release
        if: env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_SIGNING_PASSWORD == ''
        run: echo "::warning::Set ANDROID_KEYSTORE_BASE64 and ANDROID_SIGNING_PASSWORD in Actions secrets and re-run. No temporary-key Release will be published."
      - name: Restore permanent signing key
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_SIGNING_PASSWORD != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/txtreader-signing.p12"
          # Copying password.txt into Actions secrets can include CR/LF at the end.
          # The provisioned key uses an alphanumeric password without whitespace.
          NORMALIZED_PASSWORD=$(printf '%s' "$ANDROID_SIGNING_PASSWORD" | tr -d '\r\n')
          if ! keytool -list -storetype PKCS12 \
              -keystore "$RUNNER_TEMP/txtreader-signing.p12" \
              -alias txtreader -storepass "$NORMALIZED_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Signing key validation failed. Check that both Actions secrets match the supplied signing bundle."
            exit 1
          fi
          echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/txtreader-signing.p12" >> "$GITHUB_ENV"
          printf 'ANDROID_SIGNING_PASSWORD=%s\n' "$NORMALIZED_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed and compressed APK
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_SIGNING_PASSWORD != ''
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK certificate
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_SIGNING_PASSWORD != ''
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Check permanent certificate fingerprint
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_SIGNING_PASSWORD != ''
        run: |
          ACTUAL=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ "$ACTUAL" != "558a589e18e4c93268232b7df46283085019ec68087b09d1bece5b67f9ca6866" ]; then
            echo "::error::APK was signed by an unexpected certificate. Refusing to publish a build that cannot upgrade existing installs."
            exit 1
          fi
      - name: Prepare APK
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_SIGNING_PASSWORD != ''
        run: cp app/build/outputs/apk/release/app-release.apk txt-reader-v0.1.2.apk
      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_SIGNING_PASSWORD != ''
        with:
          name: txt-reader-v0.1.2-apk
          path: txt-reader-v0.1.2.apk
      - name: Publish permanent-key Release
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_SIGNING_PASSWORD != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.2 >/dev/null 2>&1; then
            gh release upload v0.1.2 txt-reader-v0.1.2.apk --clobber
          else
            gh release create v0.1.2 txt-reader-v0.1.2.apk --title "TXT Reader v0.1.2" --notes "永久签名、ZIP 备份恢复书架与进度、后台连续朗读、单句浅色高亮。"
          fi
